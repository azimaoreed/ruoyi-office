name: Build backend image and deploy by Docker

on:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to target host after pushing image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: tcr-docker-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: yudao-server
  CONTAINER_NAME: yudao-server
  DOCKER_NETWORK: ruoyi-office

jobs:
  build-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate TCR inputs
        run: |
          set -euo pipefail
          test -n "${{ secrets.TCR_REGISTRY }}"
          test -n "${{ secrets.TCR_NAMESPACE }}"
          test -n "${{ secrets.TCR_USERNAME }}"
          test -n "${{ secrets.TCR_PASSWORD }}"

      - name: Build yudao-server jar
        run: mvn -B clean package -DskipTests -pl yudao-server -am

      - name: Login to TCR
        run: |
          echo "${{ secrets.TCR_PASSWORD }}" \
            | docker login "${{ secrets.TCR_REGISTRY }}" \
              --username "${{ secrets.TCR_USERNAME }}" \
              --password-stdin

      - name: Build and push Docker image
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          IMAGE="${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${IMAGE_NAME}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" ./yudao-server
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend container
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' || github.event.inputs.deploy == 'true'

    steps:
      - name: Validate deploy inputs
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.MYSQL_URL }}"
          test -n "${{ secrets.MYSQL_USERNAME }}"
          test -n "${{ secrets.MYSQL_PASSWORD }}"
          test -n "${{ secrets.REDIS_HOST }}"

      - name: Deploy via Docker on target host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            IMAGE="${{ needs.build-push.outputs.image }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            DOCKER_NETWORK="${{ env.DOCKER_NETWORK }}"
            HOST_PORT="${{ secrets.BACKEND_HOST_PORT || '48080' }}"
            JAVA_OPTS="${{ secrets.JAVA_OPTS || '-Xms512m -Xmx2048m -Djava.security.egd=file:/dev/./urandom' }}"

            echo "${{ secrets.TCR_PASSWORD }}" \
              | docker login "${{ secrets.TCR_REGISTRY }}" \
                --username "${{ secrets.TCR_USERNAME }}" \
                --password-stdin

            docker network inspect "${DOCKER_NETWORK}" >/dev/null 2>&1 \
              || docker network create "${DOCKER_NETWORK}"

            mkdir -p /data/ruoyi-office/yudao-server/logs
            docker pull "${IMAGE}"
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart always \
              --network "${DOCKER_NETWORK}" \
              -p "${HOST_PORT}:48080" \
              -e TZ=Asia/Shanghai \
              -e ARGS="--spring.profiles.active=prod" \
              -e JAVA_OPTS="${JAVA_OPTS}" \
              -e MYSQL_URL="${{ secrets.MYSQL_URL }}" \
              -e MYSQL_USERNAME="${{ secrets.MYSQL_USERNAME }}" \
              -e MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
              -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
              -e REDIS_PORT="${{ secrets.REDIS_PORT || '6379' }}" \
              -e REDIS_DATABASE="${{ secrets.REDIS_DATABASE || '0' }}" \
              -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
              -v /data/ruoyi-office/yudao-server/logs:/yudao-server/logs \
              "${IMAGE}"

            docker ps --filter "name=${CONTAINER_NAME}"
